services:
  storage-init:
    build:
      context: .
      target: runtime
    user: "0:0"
    command: ["node", "/app/scripts/prepare-backup-storage.mjs"]
    environment:
      COMPOSEBASTION_UID: "1000"
      COMPOSEBASTION_GID: "1000"
    volumes:
      - backups:/data/backups
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    restart: "no"

  database-init:
    build:
      context: .
      target: runtime
    user: "1000:1000"
    command: ["node", "/app/scripts/prepare-database-upgrade.mjs", "reconcile", "--state-file", "/var/lib/composebastion/upgrade-state/database-transition.json"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgres://composebastion:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/composebastion}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - upgrade-state:/var/lib/composebastion/upgrade-state
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    command: ["node", "apps/api/dist/server.js"]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET to a unique random value of at least 32 characters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgres://composebastion:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/composebastion}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BACKUP_DIR: /data/backups
      WEB_DIST_DIR: /app/apps/web/dist
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_PRIVATE_AGENT_URLS: ${ALLOW_PRIVATE_AGENT_URLS:-false}
      ALLOW_PRIVATE_WEBHOOK_URLS: ${ALLOW_PRIVATE_WEBHOOK_URLS:-false}
      BLOCK_PRIVATE_S3_ENDPOINTS: ${BLOCK_PRIVATE_S3_ENDPOINTS:-false}
      BACKUP_ENCRYPTION_KEYS: ${BACKUP_ENCRYPTION_KEYS:-}
      BACKUP_ENCRYPTION_ACTIVE_KEY_ID: ${BACKUP_ENCRYPTION_ACTIVE_KEY_ID:-app_secret}
      BACKUP_HOST_PATH_ALLOWED_ROOTS: ${BACKUP_HOST_PATH_ALLOWED_ROOTS:-}
      IMAGE_SCANNER_PROVIDER: ${IMAGE_SCANNER_PROVIDER:-auto}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-composebastion@example.com}
    ports:
      - "8080:8080"
    volumes:
      - backups:/data/backups
    depends_on:
      storage-init:
        condition: service_completed_successfully
      database-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET to a unique random value of at least 32 characters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgres://composebastion:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/composebastion}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BACKUP_DIR: /data/backups
      ALLOW_PRIVATE_AGENT_URLS: ${ALLOW_PRIVATE_AGENT_URLS:-false}
      ALLOW_PRIVATE_WEBHOOK_URLS: ${ALLOW_PRIVATE_WEBHOOK_URLS:-false}
      BLOCK_PRIVATE_S3_ENDPOINTS: ${BLOCK_PRIVATE_S3_ENDPOINTS:-false}
      BACKUP_ENCRYPTION_KEYS: ${BACKUP_ENCRYPTION_KEYS:-}
      BACKUP_ENCRYPTION_ACTIVE_KEY_ID: ${BACKUP_ENCRYPTION_ACTIVE_KEY_ID:-app_secret}
      BACKUP_HOST_PATH_ALLOWED_ROOTS: ${BACKUP_HOST_PATH_ALLOWED_ROOTS:-}
      IMAGE_SCANNER_PROVIDER: ${IMAGE_SCANNER_PROVIDER:-auto}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-composebastion@example.com}
      HOST_CHECK_INTERVAL_MS: ${HOST_CHECK_INTERVAL_MS:-60000}
      INVENTORY_SYNC_INTERVAL_MS: ${INVENTORY_SYNC_INTERVAL_MS:-300000}
    volumes:
      - backups:/data/backups
    depends_on:
      storage-init:
        condition: service_completed_successfully
      database-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
        required: false
    stop_grace_period: 45s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: composebastion
      POSTGRES_USER: composebastion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composebastion -d composebastion"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  backups:
  upgrade-state:
  postgres-data:
  redis-data:
