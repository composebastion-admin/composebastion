# Upgrade-only dependencies layered over the pre-1.2 Compose definition
# materialized by scripts/acceptance/run.mjs. Deliberately do not add the 1.2
# initializer services or override app/worker: both updater hops must keep using
# the operator's original single Compose file.
services:
  postgres:
    image: postgres:16.6-alpine3.20@sha256:1e59919c179e296eaf3cc701f4d50bab5c393d7ed9746c188c9d519489c998dc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composebastion -d composebastion"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.1-alpine3.20@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    ports:
      - "127.0.0.1:${ACCEPTANCE_REGISTRY_PORT:-18050}:5000"

  sshhost:
    build:
      context: ${ACCEPTANCE_RUNTIME_DIR:?Set ACCEPTANCE_RUNTIME_DIR}/git-build-context
      dockerfile: infra/dev/sshhost.Dockerfile
    environment:
      COMPOSEBASTION_SSH_AUTHORIZED_KEYS: ${COMPOSEBASTION_SSH_AUTHORIZED_KEYS:?Set COMPOSEBASTION_SSH_AUTHORIZED_KEYS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ACCEPTANCE_RUNTIME_DIR:?Set ACCEPTANCE_RUNTIME_DIR}:${ACCEPTANCE_RUNTIME_DIR:?Set ACCEPTANCE_RUNTIME_DIR}
